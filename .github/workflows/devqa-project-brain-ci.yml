name: DevQA Project Brain verification

on:
  push:
    branches:
      - feature/service01-project-brain
      - feature/devqa-monorepo-scaffold
  pull_request:
  workflow_dispatch:
    inputs:
      verify_ides:
        description: Run the configured IntelliJ Plugin Verifier matrix (large downloads)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: devqa-project-brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Verify frontend, backend, contracts and build plugin ZIP
        run: gradle --no-daemon check buildPlugin
      - name: Verify configured IntelliJ versions when manually requested
        # workflow_dispatch requires this workflow on the default branch.
        # Until then, a feature-branch push with [verify-ides] in its commit message can opt in.
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_ides) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-ides]')) }}
        run: gradle --no-daemon verifyPlugin
      - name: Retain Gradle test and verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: devqa-gradle-verification
          if-no-files-found: ignore
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/pluginVerifier/
